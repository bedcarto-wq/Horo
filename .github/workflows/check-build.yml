name: Check and build Horo
on:
  push:
    branches: [main, version/0.1, version/0.2.0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
  windows:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build editor and copy documentation and examples
        shell: pwsh
        run: |
          try { ./scripts/build_windows.ps1 *>&1 | Tee-Object -FilePath windows-build.log }
          catch { $_ | Out-String | Add-Content windows-build.log; throw }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-log
          path: windows-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: Horo-0.2.0-Windows-x64
          path: dist/Horo-0.2.0-Windows-x64.zip
      - name: Publish preview release (not on PRs)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/version/0.2.0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.0-preview"
          gh release view $tag --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "Horo 0.2.0 — preview" --notes "Windows x64 editor. Unzip the entire folder. BUILD.txt identifies the exact source commit. Source tests are automated; interactive acceptance on Windows without Python is still required."
            if ($LASTEXITCODE -ne 0) { throw "Не удалось создать Release" }
          }
          gh release upload $tag dist/Horo-0.2.0-Windows-x64.zip --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Не удалось загрузить Windows ZIP" }
