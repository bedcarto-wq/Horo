[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "horo-editor"
version = "0.2.0"
description = "Локальный 2D-редактор с визуальным программированием"
requires-python = ">=3.12,<3.14"
dependencies = ["PySide6>=6.8,<6.9"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
build = ["PyInstaller>=6.11,<7"]

[project.scripts]
horo = "horo.__main__:main"

[tool.setuptools.packages.find]
include = ["horo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
